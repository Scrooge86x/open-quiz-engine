<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div id="result-view" style="display: none; flex-direction: column; gap: 1.5rem;">
      <h1>Quiz Result</h1>

      <div class="quiz-info">
        <p><strong>Nick:</strong> <span id="result-nick"></span></p>
        <p><strong>Score:</strong> <span id="result-score"></span></p>
        <p><strong>Time:</strong> <span id="result-time"></span></p>
      </div>

      <div id="not-finished" style="display: none; flex-direction: column; gap: 0.75rem;">
        <p style="color: var(--text-muted);">This attempt is not finished yet.</p>
        <p><a id="back-to-game" href="#" style="color: var(--primary-color); text-decoration: underline;">Back to the game</a></p>
      </div>

      <div id="error-box"></div>

      <div class="leaderboard-section">
        <h2>Leaderboard</h2>
        <p id="leaderboard-empty" style="display: none; color: var(--text-muted);">Nobody has finished this quiz yet.</p>
        <table id="leaderboard-table" style="display: none;">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Nick</th>
              <th>Score</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>

      <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
        <a id="play-again-btn" href="#" class="btn">Play again</a>
        <a href="/" class="btn" style="background-color: var(--secondary-bg); color: var(--text-color);">New quiz</a>
      </div>
    </div>
  </div>

  <footer>
    <p>Questions come from <a href="https://opentdb.com" target="_blank" rel="noopener noreferrer">Open Trivia DB (https://opentdb.com)</a>, licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>.</p>
  </footer>

  <script src="common.js"></script>
  <script src="result.js"></script>
</body>
</html>
