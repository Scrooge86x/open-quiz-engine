<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme-toggle" type="button" class="theme-toggle" aria-label="Toggle color theme"></button>
  <div class="container">
    <div id="quiz-view" style="display: none; flex-direction: column; gap: 1.5rem;">
      <h1>Quiz Details</h1>
      <div class="quiz-info">
        <p><strong>Questions:</strong> <span id="quiz-question-count"></span></p>
        <p><strong>Difficulty:</strong> <span id="quiz-difficulty"></span></p>
      </div>

      <div class="share-section">
        <h2>Share this quiz</h2>
        <div class="form-group" style="margin-top: 0.5rem;">
          <input type="text" id="share-url" readonly>
          <div style="display: flex; align-items: center; gap: 0.75rem; margin-top: 0.5rem;">
            <button type="button" id="copy-btn">Copy link</button>
            <span id="copy-status" style="color: var(--text-muted); font-size: 0.95rem;"></span>
          </div>
        </div>
      </div>

      <form id="start-form">
        <div class="form-group">
          <label for="nick">Your nick</label>
          <input type="text" id="nick" name="nick" maxlength="30">
        </div>
        <button type="submit" id="start-btn">Start</button>
      </form>
      <div id="error-box"></div>

      <div class="leaderboard-section">
        <h2>Leaderboard</h2>
        <p id="leaderboard-empty" style="display: none; color: var(--text-muted);">Nobody has finished this quiz yet.</p>
        <table id="leaderboard-table" style="display: none;">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Nick</th>
              <th>Score</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
    </div>

    <div id="not-found-view" style="display: none; flex-direction: column; gap: 1rem;">
      <p id="not-found-message" style="color: var(--error-text);"></p>
      <p><a href="/" style="color: var(--primary-color); text-decoration: underline;">Back to home</a></p>
    </div>
  </div>

  <footer>
    <p>Questions come from <a href="https://opentdb.com" target="_blank" rel="noopener noreferrer">Open Trivia DB (https://opentdb.com)</a>, licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>.</p>
  </footer>

  <script src="common.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
